name: Build and Test .NET

on:
  workflow_call:
    inputs:
      working-directory:
        description: "The working directory to execute from"
        required: false
        type: string
        default: "./"
      add-editorconfig:
        description: "Condition for whether the .editorconfig gets added"
        required: false
        type: boolean
        default: true
      add-runsettings:
        description: "Condition for whether the .runsettings gets added"
        required: false
        type: boolean
        default: true
      check-formatting:
        description: "Condition for whether dotnet format gets run"
        required: false
        type: boolean
        default: true
      dotnet-build-enforce-code-style:
        description: "Condition for whether to turn on EnforceCodeStyleInBuild msbuild property"
        required: false
        type: boolean
        default: true
      add-analyzers:
        description: "Condition for whether analyzers gets verified that they are added"
        required: false
        type: boolean
        default: true
      add-dependencies:
        description: "Condition for whether analyzers gets verified that they are added"
        required: false
        type: boolean
        default: true
      enable-net-analyzers:
        description: "Condition for whether .net analyzers get enabled"
        required: false
        type: boolean
        default: true
      enable-nullability:
        description: "Condition for whether .nullability gets enabled"
        required: false
        type: boolean
        default: true
      test-runner:
        description: "Test runner to use: 'auto' (read test.runner from global.json), 'VSTest', or 'MTP'"
        required: false
        type: string
        default: "auto"

permissions:
  contents: read

jobs:
  build-and-test:
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Detect test runner
        id: runner
        working-directory: "."
        env:
          REQUESTED_RUNNER: ${{ inputs.test-runner }}
        run: |
          runner="$REQUESTED_RUNNER"
          if [ "$runner" = "auto" ]; then
            runner=$(jq -r '.test.runner // "VSTest"' global.json 2>/dev/null || echo "VSTest")
          fi
          case "$runner" in
            MTP|Microsoft.Testing.Platform) runner="MTP" ;;
            *) runner="VSTest" ;;
          esac
          echo "Using test runner: $runner"
          echo "runner=$runner" >> "$GITHUB_OUTPUT"

      # .editorconfig and .runsettings files getting added
      - name: Download .editorconfig file
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: "main"
          path: "temp"
          persist-credentials: false
          sparse-checkout: |
            Shared/.editorconfig
            Shared/.runsettings
            Shared/analyzers.txt
            Shared/dependencies.txt
            Shared/dependencies.mtp.txt
          sparse-checkout-cone-mode: false
      - name: Copy .editorconfig file if not exists
        working-directory: "."
        if: ${{ inputs.add-editorconfig }}
        run: |
          if [ ! -f ${{ inputs.working-directory }}/.editorconfig ]; then
            echo ".editorconfig not found in ${{ inputs.working-directory }}, so copying to ${{ inputs.working-directory }}"
            cp temp/Shared/.editorconfig ${{ inputs.working-directory }}
          else
            echo ".editorconfig found in ${{ inputs.working-directory }}"
          fi
      - name: Copy .runsettings file
        working-directory: "."
        if: ${{ inputs.add-runsettings }}
        run: cp temp/Shared/.runsettings .

      - name: Restore dependencies
        run: dotnet restore

      # Check for Analyzers
      - name: Check if analyzer packages are installed and add if not
        if: ${{ inputs.add-analyzers }}
        working-directory: "."
        shell: pwsh
        run: |
          $analyzersPath = "${{ github.workspace }}/temp/Shared/analyzers.txt"
          if (-not (Test-Path -Path $analyzersPath)) {
          Write-Error "File not found: $analyzersPath"
          exit 1
          }
          $testDirectories = Get-ChildItem -Path "${{ inputs.working-directory }}" -Filter "*Tests" -Directory
          if ($testDirectories.Count -eq 0) {
            Write-Error "No directories with '*Tests' found in '${{ inputs.working-directory }}'"
            exit 1
          }
          $testDirectories | ForEach-Object {
          Set-Location -Path $_.FullName
          $analyzers = Get-Content $analyzersPath
          foreach ($analyzer in $analyzers) {
              $package = dotnet list package | Select-String -Pattern $analyzer
              if ($null -eq $package) {
              dotnet add package $analyzer
              }
          }
          Set-Location -Path ${{ github.workspace }}
          }

      # Check for certain dependencies
      - name: Check if dependent packages are installed and add if not
        if: ${{ inputs.add-dependencies }}
        working-directory: "."
        shell: pwsh
        run: |
          $dependenciesFile = if ("${{ steps.runner.outputs.runner }}" -eq "MTP") { "dependencies.mtp.txt" } else { "dependencies.txt" }
          $analyzersPath = "${{ github.workspace }}/temp/Shared/$dependenciesFile"
          if (-not (Test-Path -Path $analyzersPath)) {
          Write-Error "File not found: $analyzersPath"
          exit 1
          }
          $testDirectories = Get-ChildItem -Path "${{ inputs.working-directory }}" -Filter "*Tests" -Directory
          if ($testDirectories.Count -eq 0) {
            Write-Error "No directories with '*Tests' found in '${{ inputs.working-directory }}'"
            exit 1
          }
          $testDirectories | ForEach-Object {
          Set-Location -Path $_.FullName
          $analyzers = Get-Content $analyzersPath
          foreach ($analyzer in $analyzers) {
              $package = dotnet list package --include-transitive | Select-String -Pattern "^\s*>\s+$([regex]::Escape($analyzer))\s"
              if ($null -eq $package) {
              dotnet add package $analyzer
              }
          }
          Set-Location -Path ${{ github.workspace }}
          }

      - name: Run dotnet format
        if: ${{ inputs.check-formatting }}
        run: dotnet format --verify-no-changes --verbosity diagnostic

      - name: Build
        run: dotnet build --no-restore -p:Nullable=${{ inputs.enable-nullability == true && 'enable' || 'disable' }} -p:TreatWarningsAsErrors=true -p:EnableNETAnalyzers=${{ inputs.enable-net-analyzers }} -p:CodeAnalysisTreatWarningsAsErrors=true -p:NoWarn=EnableGenerateDocumentationFile -p:AnalysisLevel=latest-Recommended -p:EnforceCodeStyleInBuild=${{ inputs.dotnet-build-enforce-code-style }}
      - name: Test (VSTest)
        if: ${{ steps.runner.outputs.runner != 'MTP' }}
        run: dotnet test --no-build --verbosity normal --settings ${{github.workspace}}/.runsettings /p:CollectCoverage=true --collect:"XPlat Code Coverage" --logger trx --results-directory coveragereport
      - name: Test (Microsoft.Testing.Platform)
        if: ${{ steps.runner.outputs.runner == 'MTP' }}
        run: dotnet test --no-build --verbosity normal --results-directory coveragereport --report-trx --report-gh --coverage --coverage-output-format cobertura

      - name: ReportGenerator
        id: reportgenerator
        if: ${{ !cancelled() && github.event_name == 'pull_request' && hashFiles('**/*.cobertura.xml') != '' }}
        uses: danielpalme/ReportGenerator-GitHub-Action@5.5.12
        with:
          reports: '**/*.cobertura.xml'
          targetdir: coveragereport
          reporttypes: MarkdownSummaryGithub

      - name: Write to Job Summary
        if: ${{ !cancelled() && steps.reportgenerator.outcome == 'success' }}
        working-directory: "."
        run: cat coveragereport/SummaryGithub.md >> $GITHUB_STEP_SUMMARY

      - name: Upload coverage summary
        if: ${{ !cancelled() && steps.reportgenerator.outcome == 'success' }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: pr-coverage-${{ github.run_attempt }}
          path: coveragereport/SummaryGithub.md
          if-no-files-found: error
          retention-days: 14

      - name: ReportGenerator (HTML)
        id: reportgenerator-html
        if: ${{ !cancelled() && steps.reportgenerator.outcome == 'success' }}
        uses: danielpalme/ReportGenerator-GitHub-Action@5.5.12
        with:
          reports: '**/*.cobertura.xml'
          targetdir: coverage-html
          reporttypes: HtmlInline

      - name: Upload HTML coverage report
        id: upload-coverage-html
        if: ${{ !cancelled() && steps.reportgenerator-html.outcome == 'success' }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage-html-${{ github.run_attempt }}
          path: coverage-html/
          if-no-files-found: error
          retention-days: 14

      - name: ReportGenerator (HTML summary)
        id: reportgenerator-html-summary
        if: ${{ !cancelled() && steps.reportgenerator.outcome == 'success' }}
        uses: danielpalme/ReportGenerator-GitHub-Action@5.5.12
        with:
          reports: '**/*.cobertura.xml'
          targetdir: coverage-html-summary
          reporttypes: HtmlSummary

      # Unarchived artifacts must be a single file and are named after it.
      - name: Prepare browsable HTML summary
        if: ${{ !cancelled() && steps.reportgenerator-html-summary.outcome == 'success' }}
        working-directory: "."
        run: |
          mkdir -p coverage-html-view
          cp coverage-html-summary/summary.html "coverage-html-view/coverage-summary-${{ github.run_attempt }}.html"

      - name: Upload browsable HTML summary
        id: upload-coverage-html-summary
        if: ${{ !cancelled() && steps.reportgenerator-html-summary.outcome == 'success' }}
        uses: actions/upload-artifact@v7.0.2
        with:
          path: coverage-html-view/coverage-summary-${{ github.run_attempt }}.html
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Link HTML coverage in Job Summary
        if: ${{ !cancelled() && (steps.upload-coverage-html-summary.outputs.artifact-url != '' || steps.upload-coverage-html.outputs.artifact-url != '') }}
        working-directory: "."
        env:
          SUMMARY_URL: ${{ steps.upload-coverage-html-summary.outputs.artifact-url }}
          FULL_URL: ${{ steps.upload-coverage-html.outputs.artifact-url }}
        run: |
          {
            echo ""
            echo "### HTML coverage report"
            if [ -n "$SUMMARY_URL" ]; then
              echo "- [View coverage summary in browser]($SUMMARY_URL)"
            fi
            if [ -n "$FULL_URL" ]; then
              echo "- [Download full line-by-line report (zip)]($FULL_URL)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Explain missing coverage
        if: ${{ !cancelled() && steps.reportgenerator.outcome == 'skipped' }}
        run: echo "::notice::No coverage was produced. The PR reporter will still publish the run outcome."

      - name: Convert failing tests to VS Playlist
        if: failure()
        uses: BenjaminMichaelis/trx-to-vsplaylist@v4
        with:
          trx-file-path: '${{ inputs.working-directory }}/coveragereport/**/*.trx'
          test-outcomes: 'Failed'
          artifact-name: 'failed-tests-playlist'
